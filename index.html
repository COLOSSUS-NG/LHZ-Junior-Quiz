<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-lg glass-card overflow-hidden">

            <h1 class="text-xl font-extrabold text-slate-800 tracking-tight uppercase">RCCG Lighthouse Zone</h1>
            <p class="text-blue-600 font-semibold text-xs tracking-widest uppercase">2026 Junior Church Assessment</p>
        </header>

        <div id="reg-view" class="p-8 space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Student Name</label>
                <input type="text" id="reg-name" placeholder="Surname First..." class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-blue-500 uppercase">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Parish</label>
                <input type="text" id="reg-parish" placeholder="Enter Parish" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-blue-500 uppercase">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Age Group</label>
                    <select id="reg-age" class="w-full p-4 bg-gray-50 rounded-xl outline-none border">
                        <option value="">Select</option>
                        <option>9-12</option><option>13-15</option><option>16-19</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Area</label>
                    <select id="reg-area" class="w-full p-4 bg-gray-50 rounded-xl outline-none border">
                        <option value="">Select</option>
                        <option>Lighthouse Area</option><option>Disciples Assembly Area</option><option>Love Tabernacle Area</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="showInstructions()" class="btn-primary flex-1 text-white py-5 rounded-2xl font-bold shadow-xl mt-4 uppercase">Continue</button>
                <button onclick="showAdmin()" class="bg-gray-200 text-gray-600 px-4 py-5 rounded-2xl mt-4">⚙️</button>
            </div>
        </div>

        <div id="admin-view" class="hidden p-8">
            <h2 class="text-xl font-bold mb-4">Admin Portal</h2>
            <input type="password" id="admin-pass" placeholder="Password" class="w-full p-4 border rounded-xl mb-4">
            <div id="admin-content" class="hidden">
                <div id="results-list" class="space-y-2 max-h-60 overflow-y-auto mb-4 text-xs"></div>
                <button onclick="clearResults()" class="text-red-500 font-bold">Clear All Data</button>
            </div>
            <div class="flex gap-2">
                <button onclick="checkAdmin()" id="admin-login-btn" class="bg-blue-600 text-white p-4 rounded-xl flex-1">Login</button>
                <button onclick="showView('reg-view')" class="bg-gray-100 p-4 rounded-xl">Back</button>
            </div>
        </div>

        <div id="instructions-view" class="hidden p-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Instructions</h2>
            <div id="inst-details" class="space-y-4 mb-8"></div>
            <button onclick="startQuiz()" class="btn-primary w-full text-white py-5 rounded-2xl font-bold shadow-xl uppercase">Start Assessment</button>
        </div>

        <div id="quiz-view" class="hidden p-8">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <p id="q-cat" class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mb-1"></p>
                    <p id="progress-text" class="text-sm text-slate-400 font-medium"></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Timer</p>
                    <p id="quiz-timer" class="text-2xl font-mono font-bold text-red-500">00:00</p>
                </div>
            </div>
            <div id="question-box" class="min-h-[250px]">
                <h3 id="q-text" class="text-xl font-bold text-slate-800 leading-snug mb-8"></h3>
                <div id="options" class="space-y-3"></div>
                <div id="spelling-input-box" class="hidden space-y-4">
                    <button onclick="replaySpelling()" class="w-full p-4 bg-blue-100 text-blue-700 rounded-xl font-bold">🔊 Listen Again</button>
                    <input type="text" id="spelling-ans" class="w-full p-4 border-2 rounded-xl text-center font-bold text-xl uppercase outline-blue-500" placeholder="Type word here...">
                </div>
            </div>
            <button onclick="nextQuestion()" class="btn-primary w-full text-white py-5 rounded-2xl font-bold shadow-lg mt-8 uppercase">Submit Answer</button>
        </div>

        <div id="result-view" class="hidden p-8 text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>

            <button onclick="sendWhatsApp()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-bold shadow-lg uppercase">Backup via WhatsApp</button>

    let activeQuestions = [], currentIndex = 0, scores = { zeal: 0, spelling: 0 }, timeLeft = 0, timerInterval, userData = {};

    function showView(id) {
        document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function showInstructions() {
        userData = { 
            name: document.getElementById('reg-name').value.trim().toUpperCase(), 
            parish: document.getElementById('reg-parish').value.trim().toUpperCase(), 
            age: document.getElementById('reg-age').value, 
            area: document.getElementById('reg-area').value.toUpperCase() 
        };
        if(!userData.name || !userData.age || !userData.parish) return alert("Please fill all details!");
        document.getElementById('inst-details').innerHTML = `<div class="p-4 bg-blue-50 rounded-xl border-l-4 border-blue-500 text-sm"><p><strong>Zeal:</strong> 40 Questions (40 mins)</p><p><strong>Spelling:</strong> 20 Words (20 mins)</p></div>`;
        showView('instructions-view');
    }

    function startQuiz() {
        let spPool = userData.age === '9-12' ? sp_9_12 : (userData.age === '13-15' ? sp_13_15 : sp_16_19);
        
        let poolMCQ = mcqs[userData.age] || [];
        if(userData.age === '13-15') poolMCQ = [...mcqs["9-12"], ...mcqs["13-15"]];
        if(userData.age === '16-19') poolMCQ = [...mcqs["9-12"], ...mcqs["13-15"], ...mcqs["16-19"]];

        const zeal = poolMCQ.sort(() => 0.5 - Math.random()).slice(0, 40).map(q => ({...q, type: 'mcq'}));
        const genSp = spPool.gen.sort(() => 0.5 - Math.random()).slice(0, 10).map(w => ({ type: 'spell', cat: 'Spelling (Gen)', q: w }));
        const bibSp = spPool.bib.sort(() => 0.5 - Math.random()).slice(0, 10).map(w => ({ type: 'spell', cat: 'Spelling (Bible)', q: w }));
        
        activeQuestions = [...zeal, ...genSp, ...bibSp];
        currentIndex = 0; 
        timeLeft = 40 * 60;
        showView('quiz-view');
        document.getElementById('progress-container').classList.remove('hidden');
        startTimer();
        renderQuestion();
    }

    function renderQuestion() {
        const q = activeQuestions[currentIndex];
        if(q.type === 'spell' && currentIndex === 40) timeLeft = 20 * 60;
        document.getElementById('progress-bar').style.width = ((currentIndex + 1) / activeQuestions.length * 100) + "%";
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${activeQuestions.length}`;
        document.getElementById('q-cat').innerText = q.cat;
        document.getElementById('q-text').innerText = q.type === 'spell' ? "Listen and Spell the word:" : q.q;
        
        const box = document.getElementById('options');
        if(q.type === 'mcq') {
            box.innerHTML = q.opts.map((opt, i) => `
                <label class="option-label block p-4 rounded-xl cursor-pointer flex items-center border-2 border-slate-100 mb-2">
                    <input type="radio" name="quiz-opt" value="${['A','B','C','D'][i]}" class="hidden">
                    <span class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-lg text-xs font-bold mr-3">${['A','B','C','D'][i]}</span>
                    <span>${opt}</span>
                </label>`).join('');
            
            // LOGIC UPDATE: Handle highlighting properly
            document.querySelectorAll('.option-label').forEach(label => {
                label.onclick = function() {
                    document.querySelectorAll('.option-label').forEach(ol => {
                        ol.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-200');
                    });
                    this.classList.add('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-200');
                    this.querySelector('input').checked = true;
                };
            });
        } else {
            box.innerHTML = `
                <button onclick="speak('${q.q}')" class="w-full bg-blue-100 py-10 rounded-2xl font-black text-blue-600 text-2xl mb-4">🔊 TAP TO HEAR</button>
                <input type="text" id="spell-input" class="w-full p-5 border-2 rounded-2xl text-center uppercase font-bold text-xl outline-blue-600" autocomplete="off">`;
        }
    }

    function nextQuestion() {
        const q = activeQuestions[currentIndex];
        if(q.type === 'mcq') {
            const sel = document.querySelector('input[name="quiz-opt"]:checked');
            if(!sel) return alert("Select an answer!");
            if(sel.value === q.ans) scores.zeal++;
        } else {
            const val = document.getElementById('spell-input').value.trim().toLowerCase();
            if(!val) return alert("Please type the word!");
            if(val === q.q.toLowerCase()) scores.spelling += 3;
        }

        currentIndex++;
        if(currentIndex < activeQuestions.length) {
            // Logic Fix: Small delay so highlight is visible before rendering next
            setTimeout(renderQuestion, 200);
        } else {
            endQuiz();
        }
    }

    function startTimer() { 
        timerInterval = setInterval(() => { 
            timeLeft--; 
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60; 
            document.getElementById('quiz-timer').innerText = `${m}:${s < 10 ? '0'+s : s}`; 
            if(timeLeft <= 0) endQuiz(); 
        }, 1000);
    }

    function endQuiz() {
            clearInterval(timerInterval);
            showView('result-view');
            
            // Display results to the student
            document.getElementById('student-summary').innerText = `${userData.name} | ${userData.parish}`;
            document.getElementById('final-scores').innerHTML = `
                <div class="flex justify-between"><span>Zeal:</span><strong>${scores.zeal}/40</strong></div>
                <div class="flex justify-between"><span>Spelling:</span><strong>${scores.spelling}/60</strong></div>
                <div class="flex justify-between border-t pt-2 mt-2 font-black text-blue-700"><span>TOTAL:</span><strong>${scores.zeal+scores.spelling}/100</strong></div>`;

            // Prepare the full data object including results 
            const resultData = { 
                ...userData, 
                zealScore: scores.zeal, 
                spellingScore: scores.spelling, 
                totalScore: scores.zeal + scores.spelling, 
                time: new Date().toLocaleString() 
            };

            resultData.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

            // Save to local storage for backup (admin view)
            let history = JSON.parse(localStorage.getItem('quizResults') || '[]');
            history.push(resultData);
            localStorage.setItem('quizResults', JSON.stringify(history));

            // Queue for sync; sent now if online, otherwise automatically later
            const q = getQueue(); q.push(resultData); setQueue(q);
            flushQueue(true);
        }

    // ---------- Offline sync queue ----------
    function getQueue() { try { return JSON.parse(localStorage.getItem('pendingResults') || '[]'); } catch(e) { return []; } }
    function setQueue(q) { localStorage.setItem('pendingResults', JSON.stringify(q)); }
    let flushing = false;
    async function flushQueue(showStatus) {
        const el = document.getElementById('sync-status');
        let q = getQueue();
        if (!q.length) return;
        if (!navigator.onLine) {
            if (showStatus && el) el.innerText = "📴 SAVED OFFLINE: WILL SEND AUTOMATICALLY WHEN ONLINE";
            return;
        }
        if (flushing) return;
        flushing = true;
        try {
            for (const item of q.slice()) {
                // no-cors: the request is sent but the reply is opaque, so success = no network error
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
                setQueue(getQueue().filter(r => r.id !== item.id));
            }
            if (showStatus && el) el.innerText = "✅ SENT TO CHURCH DATABASE";
        } catch (e) {
            if (showStatus && el) el.innerText = "⚠️ SAVED ON DEVICE: WILL RETRY AUTOMATICALLY (OR USE WHATSAPP)";
        } finally { flushing = false; }
    }
    window.addEventListener('online', () => flushQueue(true));
    window.addEventListener('load', () => flushQueue(false));
    setInterval(() => flushQueue(false), 60000);

    // ---------- Service worker (offline support) ----------
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    function speak(word) { window.speechSynthesis.speak(new SpeechSynthesisUtterance(word)); }
    
    function sendWhatsApp() {
        const msg = `*RCCG LHZ RESULT*\n*Student:* ${userData.name}\n*Parish:* ${userData.parish}\n*Age Group:* ${userData.age}\n*Zeal:* ${scores.zeal}\n*Spelling:* ${scores.spelling}\n*TOTAL:* ${scores.zeal+scores.spelling}/100`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
    }

    }
    
    function loadResults() {
        const results = JSON.parse(localStorage.getItem('quizResults') || '[]');
        document.getElementById('results-list').innerHTML = results.map(r => `<div class="p-2 bg-gray-50 border-b">${r.name} - ${r.totalScore ?? r.total ?? '?'}/100</div>`).join('') || "No local results yet.";
        const pend = getQueue().length;
        if (pend) document.getElementById('results-list').insertAdjacentHTML('afterbegin', `<div class="p-2 mb-2 bg-yellow-50 text-yellow-800 text-sm font-bold">⏳ ${pend} result(s) waiting to sync</div>`);
    }
    
    function clearResults() { if(confirm("Clear all results?")) { localStorage.removeItem('quizResults'); loadResults(); } }

        function sendWhatsApp() {
            const total = scores.mv + scores.bz + scores.bb + scores.sbk + scores.sgk;
            const msg = `*RCCG LHZ RESULT*\n*Student:* ${userData.name}\n*Parish:* ${userData.parish}\n*Age:* ${userData.age}\n*Zeal Quiz:* ${scores.mv+scores.bz+scores.bb}/40\n*Spelling:* ${scores.sbk+scores.sgk}/60\n*TOTAL:* ${total}/100`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
        }
    </script>
